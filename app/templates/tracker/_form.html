<div class="mb-4 flex items-center justify-between">
  <h3 class="flex items-center gap-2 text-base font-semibold text-slate-900">
    <svg viewBox="0 0 24 24" class="h-5 w-5 text-brand-700" aria-hidden="true"><use href="#i-lapiz"/></svg>
    Editar <span class="font-mono text-sm text-slate-500">{{ ticket.codigo }}</span>
  </h3>
  <button type="button" onclick="cerrarModal('modal-editar')"
          class="inline-flex h-8 w-8 cursor-pointer items-center justify-center rounded-lg text-slate-400 transition-colors duration-150 hover:bg-slate-100 hover:text-slate-700">
    <svg viewBox="0 0 24 24" class="h-4 w-4" aria-hidden="true"><use href="#i-cerrar"/></svg>
    <span class="sr-only">Cerrar</span>
  </button>
</div>

<form method="post" action="{% url 'ticket_editar' ticket.pk %}" class="space-y-3" onsubmit="bloquear(this)">
  {% csrf_token %}
  {% include "tracker/_campos.html" with form=form %}

  <p class="flex items-start gap-2 rounded-lg bg-slate-50 p-2.5 text-xs text-slate-600 ring-1 ring-slate-200">
    <svg viewBox="0 0 24 24" class="mt-0.5 h-3.5 w-3.5 shrink-0 text-slate-400" aria-hidden="true"><use href="#i-reloj"/></svg>
    Cada campo que modifiques queda registrado en el historial con tu usuario y la fecha.
  </p>

  <div class="flex justify-end gap-2 border-t border-slate-200 pt-4">
    <button type="button" onclick="cerrarModal('modal-editar')"
            class="cursor-pointer rounded-lg bg-white px-4 py-2 text-sm font-semibold text-slate-600 ring-1 ring-slate-300 transition-colors duration-150 hover:bg-slate-50">Cancelar</button>
    <button class="cursor-pointer rounded-lg bg-brand-800 px-4 py-2 text-sm font-semibold text-white transition-colors duration-150 hover:bg-brand-900 disabled:cursor-not-allowed disabled:opacity-50">Guardar cambios</button>
  </div>
</form>
