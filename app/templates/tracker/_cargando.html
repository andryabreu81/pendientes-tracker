{% comment %}
Esqueleto de carga: reserva el espacio para que el modal no salte
cuando llega el contenido real.
{% endcomment %}
<div class="animate-pulse space-y-4" aria-busy="true" aria-live="polite">
  <span class="sr-only">Cargando contenido…</span>
  <div class="h-4 w-24 rounded bg-slate-200"></div>
  <div class="h-6 w-3/4 rounded bg-slate-200"></div>
  <div class="h-20 rounded-xl bg-slate-100"></div>
  <div class="grid grid-cols-2 gap-4">
    <div class="h-10 rounded bg-slate-100"></div>
    <div class="h-10 rounded bg-slate-100"></div>
    <div class="h-10 rounded bg-slate-100"></div>
    <div class="h-10 rounded bg-slate-100"></div>
  </div>
  <div class="h-24 rounded-lg bg-slate-100"></div>
</div>
